<div class="layout">
  <div class="panel"><h2>Who paid and how much</h2><div id="d_list"></div><button class="btn" id="d_add" type="button">+ Add person</button></div>
  <div class="panel result">
    <div class="lbl">Share per person</div><div class="big" id="d_quota">–</div>
    <div class="lines"><div class="ln"><span>Total spent</span><b id="d_tot">–</b></div>
    <div style="margin-top:10px;font-weight:600">To settle up:</div><div id="d_tr"></div></div>
  </div>
</div>
<div class="ad">Advertisement</div>
<article class="info"><h2>How does it work?</h2><p>The total is split equally. Anyone who paid more than their share gets the difference back, and anyone who paid less pays it in. The calculator keeps the number of money transfers to a minimum.</p></article>
<script>
let people=[{n:'Mark',v:120},{n:'Julia',v:45},{n:'Luke',v:0}];
function renderD(){$('d_list').innerHTML=people.map((p,k)=>`<div class="person"><input data-k="${k}" data-f="n" value="${esc(p.n)}" placeholder="Name" aria-label="Name"><input data-k="${k}" data-f="v" type="number" inputmode="decimal" step="0.01" value="${p.v}" placeholder="€" aria-label="Amount paid"><button data-del="${k}" title="Remove" type="button">×</button></div>`).join('');calcD()}
$('d_list').addEventListener('input',e=>{const t=e.target,k=+t.dataset.k;if(isNaN(k))return;if(t.dataset.f==='n')people[k].n=t.value;else people[k].v=parseFloat(t.value)||0;calcD()});
$('d_list').addEventListener('click',e=>{const k=e.target.dataset.del;if(k===undefined||people.length<=2)return;people.splice(+k,1);renderD()});
$('d_add').addEventListener('click',()=>{people.push({n:'Person '+(people.length+1),v:0});renderD()});
function calcD(){const tot=people.reduce((s,p)=>s+p.v,0),q=tot/people.length;$('d_tot').textContent=eur(tot);$('d_quota').textContent=eur(q);
  const bal=people.map(p=>({n:p.n||'?',b:Math.round((p.v-q)*100)}));
  const cred=bal.filter(x=>x.b>0).sort((a,b)=>b.b-a.b),deb=bal.filter(x=>x.b<0).map(x=>({n:x.n,b:-x.b})).sort((a,b)=>b.b-a.b);
  let out='',i=0,j=0;while(i<deb.length&&j<cred.length){const m=Math.min(deb[i].b,cred[j].b);if(m>0)out+=`<div class="transfer"><span>${esc(deb[i].n)} → ${esc(cred[j].n)}</span><b>${eur(m/100)}</b></div>`;deb[i].b-=m;cred[j].b-=m;if(deb[i].b===0)i++;if(cred[j].b===0)j++}
  $('d_tr').innerHTML=out||'<div class="transfer"><span>Already settled</span><b>✓</b></div>'}
renderD();
</script>
